apiVersion: v1
kind: Service
metadata:
  name: repobinding-controller-webhook
  namespace: platform-system
  labels:
    app: repobinding-controller
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: aphex-platform
spec:
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
      protocol: TCP
  selector:
    app: repobinding-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repobinding-controller
  namespace: platform-system
  labels:
    app: repobinding-controller
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repobinding-controller
  template:
    metadata:
      labels:
        app: repobinding-controller
        app.kubernetes.io/name: repobinding-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: aphex-platform
    spec:
      serviceAccountName: repobinding-controller
      containers:
        - name: manager
          image: ghcr.io/bdchatham/repobinding-controller:latest
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --enable-webhooks
            - --webhook-port=9443
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: repobinding-controller-webhook-cert
            defaultMode: 420
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
